name: utopia_app
description: UTOPIA student notes app.
publish_to: 'none'
version: 4.1.1+41

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  google_sign_in: ^7.2.0
  googleapis: ^13.2.0
  firebase_core: ^4.5.0
  supabase_flutter: ^2.8.4
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  firebase_messaging: ^16.1.2
  firebase_remote_config: ^6.2.0
  flutter_local_notifications: ^17.2.3
  http: ^1.6.0
  flutter_markdown: ^0.7.4
  markdown: ^7.3.0
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  dio: ^5.8.0
  open_filex: ^4.6.0
  crypto: ^3.0.6
  encrypt: ^5.0.3
  google_fonts: ^6.2.1
  provider: ^6.1.2
  connectivity_plus: ^6.1.3
  flutter_secure_storage: ^9.2.2
  flutter_math_fork: ^0.7.2
  webview_flutter: ^4.10.0
  package_info_plus: ^8.0.2
  firebase_database: ^12.1.4
  shared_preferences: ^2.3.2
  google_generative_ai: ^0.4.7
  confetti: ^0.8.0
  uuid: ^4.3.3
  share_plus: ^12.0.2
  timezone: ^0.9.4
  flutter_timezone: ^5.0.2
  firebase_storage: ^13.1.0
  file_picker: ^9.2.2
  app_links: ^7.0.0
  flutter_animate: ^4.5.2
  sqflite_common_ffi: ^2.4.0+3
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2
  intl: '>=0.18.0 <0.20.0'
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.9
  flutter_inappwebview: ^6.1.5
  just_audio: ^0.9.42
  appflowy_editor: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  file_picker: ^9.2.2
  intl: ^0.19.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon_cropped.png"
  min_sdk_size: 21

flutter:
  uses-material-design: true
  assets:
    - assets/focus screen/
    - assets/icon_cropped.png
    - assets/voices/
    - assets/logos/
  fonts:
    - family: OrangeAvenue
      fonts:
        - asset: assets/fonts/OrangeAvenue-Regular.otf
